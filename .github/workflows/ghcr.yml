name: Publish fork image to GHCR

# Builds the all-in-one OpenMU image (src/Startup/Dockerfile) of this fork and
# publishes it to the GitHub Container Registry on every push to main.
#
# Tags:
#   ghcr.io/<owner>/<repo>:latest     latest build of main
#   ghcr.io/<owner>/<repo>:sha-<sha>  immutable tag for each commit (use it to pin or roll back)
#   ghcr.io/<owner>/<repo>:v1.2.3     when a v* git tag is pushed
#
# Uses the built-in GITHUB_TOKEN, no secrets needed. The package is private by
# default: either make it public (Package settings -> Change visibility) or add
# ghcr.io credentials (a PAT with read:packages) to Coolify.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "docs-website/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Registry image names must be lowercase.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Startup/Dockerfile
          # Add linux/arm64 here if the Coolify server is ARM (makes the build much slower).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
